services:
  - type: web
    name: troid-sys
    runtime: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    # Single worker: the MQTT client and offline-checker threads start in
    # troid_api/apps.py on boot, and each gunicorn worker process would start
    # its own — multiple workers means duplicate MQTT subscriptions.
    startCommand: "gunicorn core.wsgi:application --workers 1"
    envVars:
      # Supabase Postgres connection string — set in the Render dashboard.
      # Use the Session pooler URI (see backend/.env.example).
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: troid-sys.onrender.com
      - key: REALTIME_WORKER_URL
        sync: false
      - key: REALTIME_WORKER_SECRET
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
