[build]
builder = "NIXPACKS"
buildCommand = "pip install -r requirements.txt && python manage.py collectstatic --noinput"

[deploy]
# Single worker: the MQTT client and offline-checker threads start in
# troid_api/apps.py on boot, and each gunicorn worker process would start
# its own — multiple workers means duplicate MQTT subscriptions.
startCommand = "python manage.py migrate --noinput && gunicorn core.wsgi:application --bind 0.0.0.0:$PORT --workers 1"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
